<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK Elite Solution</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
        }
        /* Navbar Styling */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #0f172a;
            border-bottom: 1px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
        }
        nav {
            display: flex;
            gap: 25px;
            align-items: center;
        }
        nav a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #38bdf8;
        }
        .login-btn {
            background-color: #ef4444;
            color: white;
            padding: 8px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .login-btn:hover {
            background-color: #dc2626;
        }
        /* Hero Section */
        .hero {
            text-align: center;
            padding: 100px 20px;
        }
        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
            color: #ffffff;
        }
        .hero p {
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .cta-btn {
            background-color: #ef4444;
            color: white;
            padding: 12px 25px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }
        /* Responsive */
        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
            }
            nav {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <header>
        <div class="logo">MK Elite Solutions</div>
        <nav>
            <a href="#home">Home</a>
            <a href="#services">Services</a>
            <a href="#dashboard">Dashboard</a>
            <a href="#about">About Us</a>
        </nav>
        <div>
            <a href="#login" class="login-btn">Login</a>
        </div>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <h1>শূন্য থেকে সফলতার পথ</h1>
        <p>অনলাইন আর্নিং, কর্মসংস্থান তৈরি এবং বিজনেস গাইডলাইনের আধুনিক প্ল্যাটফর্ম।</p>
        <a href="#login" class="cta-btn">লগইন করুন</a>
    </section>

</body>
</html>
